# A small Kirigami site used by Kiri Studio's tests and smoke runs.
kirigami:
  project: Fixture Bakery
  baseurl: https://example.com
  root:    src

prepros:
  types:
    article:
      before: _layouts/article.before.php
      after:  _layouts/article.after.php
    wide:
      before: _layouts/wide.before.php
      after:  _layouts/wide.after.php

studio:
  files: src/documents
  pageMedia: true
  pageImage: true
  include:
    - path: src/blog/*.md
      label: Blog
      create: true
    # One folder per entry, each a Markdown page with an @tag header.
    - path: src/news/*/_index.md
      label: News
      create: true
      header:
        date: today
        abstract: ""
        draft: "false"
    # A tree: every page can get sub-pages.
    - path: src/guide/**/_index.md
      label: Guide
      create: true
  labels:
    src/_home.md: Welcome text
  schemas:
    assets/schemas/team.schema.json: team.yaml
